name: Checkpoint 34 Controlled PR Authorization Review

on:
  push:
    branches: [checkpoint-34-controlled-pr-authorization]

permissions:
  contents: read
  pull-requests: read

jobs:
  controlled-pr-authorization-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch live pull-request state without mutation
        run: |
          mkdir -p validation/checkpoint34/artifacts/input
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100" \
            > validation/checkpoint34/artifacts/input/live-pr-state.json
      - name: Verify CP34 contract
        working-directory: validation/checkpoint34
        run: npm test
      - name: Audit controlled authorization review
        working-directory: validation/checkpoint34
        run: npm run audit
      - name: Verify evidence manifest
        working-directory: validation/checkpoint34/artifacts/evidence
        run: sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OE-001-Checkpoint34-Controlled-PR-Authorization-Evidence
          path: validation/checkpoint34/artifacts/evidence
          if-no-files-found: error
          retention-days: 90
